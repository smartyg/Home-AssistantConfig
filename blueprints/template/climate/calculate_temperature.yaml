blueprint:
  name: Klimaat Berekening Per Ruimte
  description: Bereken de gemiddelde temperatuur en de CV-vraag voor een ruimte.
  domain: template
  input:
    ruimte_naam_vriendelijk:
      name: Vriendelijke Naam
      description: "Bijv. 'Master bed room'"
      selector:
        text:
    temperatuur_sensoren:
      name: Losse temperatuursensoren
      default: []
      selector:
        entity:
          multiple: true
          domain: sensor
          device_class: temperature
    radiator_knoppen:
      name: Sonoff Radiator Knoppen (Climate)
      default: []
      selector:
        entity:
          multiple: true
          domain: climate
    verwarmingsfactor:
      name: Verwarmingsfactor voor ruimte
      default: ""
      selector:
        entity:
          multiple: false
          domain: input_number

variables:
  friendly: !input ruimte_naam_vriendelijk
  temp_sensors: !input temperatuur_sensoren
  radiators: !input radiator_knoppen
  factor: !input verwarmingsfactor

sensor:
  # STAP 1 & 2: Gemiddelde temperatuur berekenen over ALLE sensoren en ALLE TRV's
  - name: "{{ friendly }} gemiddelde temperatuur"
    state_class: "measurement"
    device_class: "temperature"
    unit_of_measurement: "°C"
    state: >
      {% set ns = namespace(metingen=[]) %}
      {% if temp_sensors is not none and temp_sensors is not string and temp_sensors is iterable %}
        {% for s in temp_sensors if has_value(s) %}
          {% set ns.metingen = ns.metingen + [states(s) | float] %}
        {% endfor %}
      {% endif %}

      {% if radiators is not none and radiators is not string and radiators is iterable  %}
        {% for r in radiators if has_value(r) %}
          {% set cur = state_attr(r, 'current_temperature') | float(none) %}
          {% if cur is not none and '.' in r %}
            {% set cal_entity = 'number.' ~ r.split('.')[1] ~ '_local_temperature_calibration' %}
            {% set cal = states(cal_entity) | float(0) %}
            {% set ns.metingen = ns.metingen + [cur - cal] %}
          {% endif %}
        {% endfor %}
      {% endif %}

      {% if ns.metingen | length > 0 %}
        {{ (ns.metingen | sum / ns.metingen | length) | round(1) }}
      {% else %}
        unknown
      {% endif %}
    attributes:
      central_heating_request: >
        {# Haal de zojuist berekende eigen status op. Als deze nog laadt (unknown/none), zet op 20.0 als veilige basis #}
        {% set avg_temp = states(this.entity_id) | float(none) %}

        {# FIX: Controleer of factor is ingevuld en een waarde heeft, anders default naar 1.0 #}
        {% set factor_val = states(factor) | float(0.0) if factor is not none and factor != "" and has_value(factor) else 0.0 %}
        {% set ns = namespace(max_vraag=0.0) %}

        {% if avg_temp is not none and radiators is not none and radiators is not string and radiators is iterable %}
          {% for r in radiators if has_value(r) %}
            {% if is_state_attr(r, 'hvac_action', 'heating') %}
              {% set target = state_attr(r, 'temperature') | float(avg_temp) %}
              {% set vraag = ([target - avg_temp, 0] | max) * factor_val %}
              {% if vraag > ns.max_vraag %}
                {% set ns.max_vraag = vraag %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.max_vraag | round(1) }}

      min_water_temp_request: >
        {# Haal de zojuist berekende eigen status op. #}
        {% set avg_temp = states(this.entity_id) | float(none) %}
        {% set ns = namespace(temp_request=0.0) %}

        {% if avg_temp is not none and radiators is not none and radiators is not string and radiators is iterable %}
          {% for r in radiators if has_value(r) %}
            {% if is_state_attr(r, 'hvac_action', 'heating') %}
              {% set target = state_attr(r, 'temperature') | float(avg_temp) %}
              {% set current_request = target + ([ [target - avg_temp, 0] | max * 2, 5 ] | max) %}
              {% if current_request > ns.temp_request %}
                {% set ns.temp_request = current_request %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.temp_request | round(1) }}

      Radiator_open: >
        {% set ns = namespace(heating=false) %}
        {% if radiators is not none and radiators is not string and radiators is iterable %}
          {% for r in radiators if has_value(r) %}
              {% if is_state_attr(r, 'hvac_action', 'heating') %}
                {% set ns.heating = true %}
              {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.heating }}
