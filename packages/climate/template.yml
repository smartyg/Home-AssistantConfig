sensor:
  - name: 'totale waarde cv vraag'
    unique_id: totale_waarde_cv_vraag
    state: >
      {{ states('sensor.waarde_cv_vraag_woonkamer_vloerverwarming') | float +
         states('sensor.waarde_cv_vraag_slaapkamer_1') | float +
         states('sensor.waarde_cv_vraag_slaapkamer_2') | float +
         states('sensor.waarde_cv_vraag_douche') | float +
         states('sensor.waarde_cv_vraag_zolder') | float +
         states('sensor.waarde_cv_vraag_garage') | float }}
    availability: true

