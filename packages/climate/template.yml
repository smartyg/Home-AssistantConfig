  - name: 'Warm water leveren'
    unique_id: ww_leveren
    state: >
      {{ is_state('binary_sensor.opentherm_boiler_hot_water', 'on')
         and is_state('binary_sensor.opentherm_boiler_flame', 'on') }}
    availability: true
  - name: 'Centrale verwarming leveren'
    unique_id: cv_leveren
    state: >
      {{ is_state('binary_sensor.opentherm_boiler_central_heating_1', 'on')
         and is_state('binary_sensor.opentherm_boiler_flame', 'on') }}
    availability: true
