# color_temp calculation
# RS227T: color_temp = (c - 2202) / (5000-2202) * (454 - 200) + 200
# RS227T: color_temp = (c - 2202) * 0.0908 + 200
# RS230C : color_temp = (c - 1801) / (6535 - 1801) * (555 - 153) + 153
# RS230C : color_temp = (c - 1801) * 0.0849 + 153

