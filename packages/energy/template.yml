sensor:
  - name: 'totale energie verbruik (tarief 1 & 2)'
    unique_id: totaal_energie_verbruik
    state: "{{ (states('sensor.energy_consumed_tariff_1') | float) + (states('sensor.energy_consumed_tariff_2') | float) }}"
    unit_of_measurement: kwh
    availability: true
  - name: 'totaal energie verbruik vorige dag'
    unique_id: totaal_energie_verbruik_vorige_dag
    state: "{{ state_attr('sensor.dagelijks_elektrisch_energie_verbruik', 'last_period') | float | round(2) }}"
    unit_of_measurement: kwh
    availability: true
  - name: 'totaal energie verbruik vorige maand'
    unique_id: totaal_energie_verbruik_vorige_maand
    state: "{{ state_attr('sensor.maandelijks_elektrisch_energie_verbruik', 'last_period') | float | round(1) }}"
    unit_of_measurement: kwh
    availability: true
  - name: 'totaal gas verbruik vorige dag'
    unique_id: totaal_gas_verbruik_vorige_dag
    state: "{{ state_attr('sensor.dagelijks_gas_verbruik', 'last_period') | float | round(2) }}"
    unit_of_measurement: m³
    availability: true
  - name: 'totaal gas verbruik vorige maand'
    unique_id: totaal_gas_verbruik_vorige_maand
    state: "{{ state_attr('sensor.maandelijks_gas_verbruik', 'last_period') | float | round(1) }}"
    unit_of_measurement: m³
    availability: true
  - name: 'totaal water verbruik vorige dag'
    unique_id: totaal_water_verbruik_vorige_dag
    state: "{{ state_attr('sensor.dagelijks_water_verbruik', 'last_period') | float | round(0) }}"
    unit_of_measurement: m³
    availability: true
  - name: 'totaal water verbruik vorige maand'
    unique_id: totaal_water_verbruik_vorige_maand
    state: "{{ state_attr('sensor.maandelijks_water_verbruik', 'last_period') | float | round(0) }}"
    unit_of_measurement: m³
    availability: true
